name: ci
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plain-language:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - run: python3 tools/plain_lint.py
      - name: page layout follows STYLE.md
        run: python3 tools/check_structure.py

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: assessment tool
        run: python3 -m unittest discover -s assessment/tests -v
      - name: plain-language check
        run: python3 -m unittest discover -s tools/tests -v
      - name: quiz
        run: python3 -m unittest discover -s exercises/tests -v
      - name: quiz bank is valid and exported pages are up to date
        run: python3 exercises/quiz.py --check
      - name: assessment runs on the example answers
        run: python3 assessment/assess.py --questions assessment/questions.toml --answers assessment/example-answers.toml

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: check relative links between pages
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress './**/*.md'
          fail: true

  templates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with: { python-version: "3.12" }
      - name: YAML and JSON parse
        run: |
          pip install --quiet pyyaml
          python3 - <<'PY'
          import json, pathlib, sys, yaml
          bad = 0
          for p in pathlib.Path(".").rglob("*"):
              if ".git" in p.parts or not p.is_file():
                  continue
              try:
                  if p.suffix in {".yml", ".yaml"}:
                      list(yaml.safe_load_all(p.read_text()))
                  elif p.suffix == ".json":
                      json.loads(p.read_text())
              except Exception as e:
                  print(f"{p}: {e}")
                  bad += 1
          sys.exit(1 if bad else 0)
          PY
      - name: actionlint on workflow templates
        run: |
          bash <(curl -sSLf https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/*.yml templates/github/workflows/*.yml templates/security/workflows/*.yml
      - name: shellcheck
        run: shellcheck tools/*.sh
      - name: adopt script copies templates into empty repositories
        run: |
          tmp=$(mktemp -d)
          tools/adopt.sh --target "$tmp" --platform github --with-security
          test -f "$tmp/.github/PULL_REQUEST_TEMPLATE.md"
          test -f "$tmp/.github/dependabot.yml"
          solo=$(mktemp -d)
          tools/adopt.sh --target "$solo" --platform github --solo --updates renovate
          test -f "$solo/docs/repository-rules/default-branch-solo.json"
          test -f "$solo/renovate.json"
          test ! -e "$solo/.github/dependabot.yml"
          lab=$(mktemp -d)
          tools/adopt.sh --target "$lab" --platform gitlab --with-security
          test -f "$lab/.gitlab-ci.yml"
      - name: Kubernetes templates are valid
        run: |
          curl -sSLf https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz | tar -xz kubeconform
          ./kubeconform -strict -summary -ignore-missing-schemas templates/platform/*.yaml
      - name: no Deployment fixes replicas while an autoscaler manages it
        run: |
          python3 - <<'PY2'
          import pathlib, sys, yaml
          docs = [d for f in pathlib.Path("templates/platform").glob("*.yaml") for d in yaml.safe_load_all(f.read_text()) if d]
          targets = {(d["spec"]["scaleTargetRef"]["kind"], d["spec"]["scaleTargetRef"]["name"]) for d in docs if d.get("kind") == "HorizontalPodAutoscaler"}
          bad = [d["metadata"]["name"] for d in docs if (d.get("kind"), d.get("metadata", {}).get("name")) in targets and "replicas" in d.get("spec", {})]
          if bad:
              sys.exit(f"spec.replicas set on autoscaled workloads: {bad}. Remove it; the HPA owns the replica count.")
          print(f"{len(targets)} autoscaled workload(s) checked")
          PY2
