# Open Engineering Playbook CI workflow. Copy to .github/workflows/ci.yml.
#
# Runs lint, test and build on every pull request and every push to main.
# The job names (lint, test, build) are the required status checks in
# templates/github/rulesets/default-branch.json. Keep them in step.
#
# The jobs call make targets so engineers run the same commands locally.
# Replace the make calls with your own task runner if you prefer.
#
# Pinning: actions are pinned to major version tags so this file works
# when copied. Before relying on it, pin each action to a full commit SHA
# and keep the version in a comment, for example:
#   uses: actions/checkout@<40-character-commit-sha> # v4
# Renovate (helpers:pinGitHubActionDigests) or Dependabot keep SHAs current.

name: ci

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

# Least privilege for the GITHUB_TOKEN. Grant more per job only if needed.
permissions:
  contents: read

# Cancel superseded runs on the same branch or pull request.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Set up your language toolchain here, reading the version from the repo.
      # Example for Node.js:
      # - uses: actions/setup-node@v4
      #   with:
      #     node-version-file: .nvmrc
      #     cache: npm
      # Example for Python:
      # - uses: actions/setup-python@v5
      #   with:
      #     python-version-file: .python-version
      #     cache: pip

      - name: Lint
        run: make lint

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # Cache dependency downloads keyed on the lockfile. Adjust path and key
      # for your package manager (setup-* actions can also cache for you).
      - uses: actions/cache@v4
        with:
          path: ~/.cache
          key: deps-${{ runner.os }}-${{ hashFiles('**/package-lock.json', '**/poetry.lock', '**/requirements*.txt', '**/go.sum', '**/Cargo.lock') }}
          restore-keys: |
            deps-${{ runner.os }}-

      - name: Test
        run: make test

  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build
        run: make build

      # Upload the artifact once so later stages promote it instead of rebuilding.
      # - uses: actions/upload-artifact@v4
      #   with:
      #     name: build-${{ github.sha }}
      #     path: dist/
      #     retention-days: 7
