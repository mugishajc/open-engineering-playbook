# Open Engineering Playbook release automation. Copy to .github/workflows/release-please.yml,
# and copy release-please-config.json and .release-please-manifest.json to
# the repository root.
#
# On every push to main, release-please opens or updates a release pull
# request that bumps the version and CHANGELOG.md from Conventional Commits.
# Merging that pull request creates the Git tag and the GitHub release.
#
# Pin the action to a full commit SHA before relying on this file:
#   uses: googleapis/release-please-action@<40-character-commit-sha> # v4
#
# Note: pull requests opened with the default GITHUB_TOKEN do not trigger
# other workflows, so CI will not run on the release pull request. If you
# need CI there, use a GitHub App token with the same permissions.

name: release-please

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Runs only when a release was created. Build, sign and publish here.
  publish:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build release artifact
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          echo "Building $TAG_NAME"
          make build
      # Add SBOM generation, signing and upload here.
      # See templates/security/workflows/sbom-and-sign.yml.
