# Open Engineering Playbook bug report form. Copy to .github/ISSUE_TEMPLATE/bug_report.yml.
# Schema: https://docs.github.com/en/communities/using-templates-to-encourage-useful-issues-and-pull-requests/syntax-for-issue-forms
name: Bug report
description: Something does not work as expected.
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting this. Please do not include passwords, tokens or personal data.
        To report a security vulnerability, do not open an issue. Follow SECURITY.md instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the problem in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release version, commit SHA or date you saw it.
      placeholder: "1.4.2"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - Production
        - Staging
        - Local development
        - Self-hosted or on-premises install
        - Other
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact
      description: How badly does this affect users?
      options:
        - "Blocks work, no workaround"
        - "Blocks work, workaround exists"
        - "Annoying, does not block work"
        - "Cosmetic"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove any secrets or personal data first. Logs are formatted as code.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: I removed secrets and personal data from this report.
          required: true
