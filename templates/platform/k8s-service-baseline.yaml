# Hardened baseline for one stateless HTTP service on Kubernetes.
# Documents: ServiceAccount, Deployment, Service, PodDisruptionBudget,
# HorizontalPodAutoscaler, and NetworkPolicies (default deny, allow from the
# ingress namespace, allow DNS).
#
# Replace every value in angle brackets. Tune resources, replicas and
# autoscaling from measurement after 2 weeks in production.
#
# The platform team creates the namespace (the Argo CD project template does not
# allow teams to create cluster-scoped objects). It must enforce the Pod Security
# Standards "restricted" profile, for example:
#   apiVersion: v1
#   kind: Namespace
#   metadata:
#     name: orders
#     labels:
#       pod-security.kubernetes.io/enforce: restricted
#       pod-security.kubernetes.io/enforce-version: latest
#       pod-security.kubernetes.io/warn: restricted
#       pod-security.kubernetes.io/audit: restricted
#
# Air-gapped: the image must come from the internal registry.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: orders-service
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-service
# The service does not call the Kubernetes API, so it gets no token.
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-service
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-service
    app.kubernetes.io/part-of: commerce
spec:
  # The HorizontalPodAutoscaler manages replicas. This is the starting value.
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-service
        app.kubernetes.io/part-of: commerce
    spec:
      serviceAccountName: orders-service
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      # Spread replicas across zones and nodes so one failure does not take all of them.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-service
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: orders-service
      terminationGracePeriodSeconds: 30
      # Do not inject environment variables for every Service in the namespace.
      enableServiceLinks: false
      containers:
        - name: app
          # Pin by digest so the running image is exactly the one that was signed.
          image: registry.example.org/orders/orders-service@sha256:<digest>
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: OTEL_SERVICE_NAME
              value: orders-service
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-collector.observability.svc:4318
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            privileged: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              # Memory limit equal to the request avoids surprise evictions.
              memory: 256Mi
              # Some teams omit CPU limits to avoid throttling. Decide per service.
              cpu: "1"
          startupProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: http
            periodSeconds: 20
            failureThreshold: 3
          # Optional on Kubernetes 1.30 or later: wait a few seconds before
          # SIGTERM so load balancers stop sending traffic first. Older clusters
          # need an exec sleep in the image instead.
          # lifecycle:
          #   preStop:
          #     sleep:
          #       seconds: 5
          volumeMounts:
            # Writable scratch space, since the root filesystem is read-only.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
---
apiVersion: v1
kind: Service
metadata:
  name: orders-service
  namespace: orders
  labels:
    app.kubernetes.io/name: orders-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: orders-service
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: orders-service
  namespace: orders
spec:
  # Keep at least one replica running during node drains and upgrades.
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: orders-service
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: orders-service
  namespace: orders
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: orders-service
  minReplicas: 2
  # Always set a maximum, and a budget alert to match.
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
---
# Deny all ingress and egress for every pod in the namespace unless another
# policy allows it.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: orders
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
# Allow HTTP traffic to the service only from the ingress controller namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-service-allow-from-ingress
  namespace: orders
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: <ingress-namespace>
      ports:
        - protocol: TCP
          port: 8080
---
# Allow DNS lookups and traffic to the OpenTelemetry Collector. Add one rule
# per real dependency (database, queue, other services) and nothing more.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-service-allow-egress
  namespace: orders
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: orders-service
  policyTypes:
    - Egress
  egress:
    # DNS. Labels differ on some distributions (OpenShift, NodeLocal DNSCache);
    # check yours with: kubectl -n kube-system get pods --show-labels
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: observability
          # The label the OpenTelemetry Collector Helm chart sets. Check yours.
          podSelector:
            matchLabels:
              app.kubernetes.io/name: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 4318
