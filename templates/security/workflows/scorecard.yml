# OpenSSF Scorecard: checks this repository's supply chain practices every week
# and on every push to the default branch. Results appear in the repository's
# Security tab (code scanning) and, with publish_results, on the public
# Scorecard API and badge.
#
# Copy to .github/workflows/scorecard.yml in the repository's default branch.
# Guidance: playbook/security/supply-chain.md
#
# Rules from the Scorecard action when publish_results is true: keep top-level
# permissions read-only, do not add `run:` steps, workflow-level `env:` or
# `defaults:` to this job, and use only the approved actions below.
#
# Actions are pinned to full commit SHAs, with the version in a comment, so a
# moved tag cannot change what runs. Let Dependabot or Renovate update them.
# Private repositories: the job is skipped by default, because Scorecard cannot
# read a private repository with the default token and code scanning on private
# repositories needs GitHub Advanced Security. To run it anyway, create a
# fine-grained read-only token as the SCORECARD_TOKEN secret, set the repository
# variable SCORECARD_PRIVATE to true, and remove the upload step if you do not
# have Advanced Security.

name: Scorecard supply-chain security

on:
  # Re-run when branch protection settings change.
  branch_protection_rule:
  schedule:
    # Weekly, Monday 06:17 UTC.
    - cron: "17 6 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    if: ${{ !github.event.repository.private || vars.SCORECARD_PRIVATE == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      # Upload results to code scanning.
      security-events: write
      # Publish results to the Scorecard API and badge (OIDC token).
      id-token: write
      contents: read
      actions: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || github.token }}
          # Publishing to the public Scorecard API works only for public repositories.
          publish_results: ${{ !github.event.repository.private }}

      - name: Keep results as a build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 7

      - name: Upload results to code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
